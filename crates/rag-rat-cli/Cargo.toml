[package]
name = "rag-rat"
version = "0.3.1"
description = "CLI and MCP entrypoint for indexing repositories into local source, graph, history, and memory evidence."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rag-rat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dialoguer = "0.12"
libc.workspace = true
rag-rat-core = { version = "0.3.1", path = "../rag-rat-core", default-features = false }
rag-rat-mcp = { version = "0.3.1", path = "../rag-rat-mcp", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["fastembed"]
fastembed = ["rag-rat-core/fastembed", "rag-rat-mcp/fastembed"]
