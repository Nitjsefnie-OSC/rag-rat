name: osc-adv-1251

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag or SHA containing the issue 1251 candidate or probe
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
      - name: Show checked-out ref
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run issue 1251 affected tests with the plain cargo harness
        run: |
          cargo test -p rag-rat-mcp --lib port_scan_falls_back_after_a_busy_candidate --no-default-features --locked -- --nocapture
          cargo test -p rag-rat-mcp --lib active_task_publishes_and_cleans_up_on_abort --no-default-features --locked -- --nocapture
          cargo test -p rag-rat-mcp --lib standalone_serving_publishes --no-default-features --locked -- --nocapture
          cargo test -p rag-rat-core --lib light_pass_with_unreachable_query_endpoint_defers --no-default-features --locked -- --nocapture
