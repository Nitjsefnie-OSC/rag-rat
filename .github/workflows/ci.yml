name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to the same branch/PR cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The github-papertrail tests call `gh repo view` (default_repo) to resolve bare `#N` refs.
  # Without auth, gh returns nothing and those tests fail. The auto-provided token authenticates
  # gh against this repo. (Coupling tracked in an issue; fork PRs lack this secret.)
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options (struct_lit_style, imports_granularity, …),
      # so the format check must run on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --no-default-features = hash-only build: no ONNX/model downloads, fast and network-free.
      # The full feature set is compile-checked by the build-full job below.
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Hash embedder only (no model downloads). The `ci` profile serializes tests (shared
      # on-disk self-index) and emits a JUnit report at target/nextest/ci/junit.xml.
      - name: Run tests (nextest)
        run: cargo nextest run --workspace --no-default-features --locked --profile ci
      - name: Upload test results to Codecov
        # Upload even when tests fail, so failures show up in Codecov Test Analytics.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-full:
    name: build (fastembed + model2vec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile the default feature set (downloads the ONNX runtime once, then cached) so the
      # released binary's embedding paths never break silently.
      - run: cargo build --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --no-default-features --locked --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Tokenless upload works for public repos; CODECOV_TOKEN is used if the secret is set.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
