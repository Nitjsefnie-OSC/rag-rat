[workspace]
members = [
  "crates/rag-rat-cli",
  "crates/rag-rat-core",
  "crates/rag-rat-mcp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/cq27-dev/rag-rat"

[workspace.dependencies]
anyhow = "1.0"
fastembed = { version = "5.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
gix = { version = "0.78.0", default-features = false, features = ["status", "parallel"] }
rmcp = { version = "1.7.0", features = ["transport-io"] }
rusqlite = "0.39"
rayon = "1.11"
regex = "1.11"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "0.9"
# Grammar crates are exact-pinned so parser node coverage changes deliberately.
tree-sitter = "=0.22.6"
tree-sitter-kotlin = "=0.3.8"
tree-sitter-rust = "=0.21.2"
tree-sitter-typescript = "=0.21.2"
